<form id="userForm">
  <label for="userInput">Text:</label>
  <!-- type=text um hier eine kleine Einschränkung zu geben-->
  <input
    type="text"
    id="userInput"
    name="userInput"
    placeholder="Schreibe etwas..."
  />
  <button type="submit">Absenden</button>
</form>

<div id="output">Deine Eingabe erscheint hier.</div>

<script>
  const form = document.getElementById("userForm");
  const input = document.getElementById("userInput");
  const output = document.getElementById("output");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const value = input.value.trim();

    if (!value) {
      output.textContent = "Bitte gib etwas ein.";
      return;
    }

    const formData = new URLSearchParams();
    formData.append("userInput", String(value));

    try {
      const response = await fetch("/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
      });

      const data = await response.json();

      if (!response.ok) {
        output.textContent = data.error || "Ungültige Eingabe";
        return;
      }

      output.textContent = data.message;
    } catch (error) {
      output.textContent = "Fehler beim Senden.";
    }
  });
</script>
